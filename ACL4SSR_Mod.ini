# ====================== Clash Meta 全局全代理配置（远程订阅yaml） ======================
mixed-port: 7890
allow-lan: false
mode: global # 核心：全局模式，所有流量全部走代理策略组
log-level: warning
ipv6: false # 关闭IPv6，解决油管IPv6优先导致QUIC失败
global-client-fingerprint: chrome
unified-delay: true
tcp-concurrent: true

external-controller: 127.0.0.1:9090
secret: ""

# TUN设置，安卓CMFA生效，gvisor栈优化UDP/QUIC(Youtube)
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true

# DNS全部走代理，防止DNS泄漏
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'localhost'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback: []
  fallback-filter:
    geoip: false

# 策略组
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - AUTO
      # 这里会自动填充你的所有节点，subs-check输出会自动追加所有proxy节点

  - name: AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: [] # subs-check自动填充所有节点

# 规则：全局模式下rules会被忽略，留空即可
rules: []

# 节点部分，由 subs-check 自动填充，不要手动写 proxies
proxies: []
